<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royalty Signals (Option 1: tabs)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f7f7}
a{color:#1b6b41}a:hover{color:#124d2e}
.mn *{box-sizing:border-box}
.mn{height:100vh;display:flex;flex-direction:column;background:#f6f7f7;color:#14231a;font:14px/1.45 Inter,system-ui,sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.field{border:1px solid #dfe3e1;border-radius:8px;background:#fff;min-height:36px;padding:0 10px;font:13px Inter,system-ui,sans-serif;color:#14231a}
.search{display:flex;align-items:center;gap:8px;border:1px solid #dfe3e1;border-radius:8px;background:#fff;min-height:36px;padding:0 10px;color:#7a857f;width:240px;max-width:100%}
.search input{all:unset;flex:1;min-width:0;font:13px Inter,system-ui,sans-serif;color:#14231a}
.search:focus-within{outline:2px solid #1f7a4a;outline-offset:1px}
.tabs{display:flex;gap:20px;border-bottom:1px solid #e7eae8;flex:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:0 2px;min-height:40px;font:500 13px Inter,system-ui,sans-serif;color:#66716b;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:#14231a}
.tab.on{color:#14231a;font-weight:600;border-bottom-color:#14231a}
.tab small{font-size:11px;color:#8a948f;font-weight:500}
.fl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#3c4741;border:1px solid #dfe3e1;border-radius:999px;padding:2px 4px 2px 9px;background:#fff;white-space:nowrap}
.fl i{width:6px;height:6px;border-radius:50%;display:inline-block}
.fl b{font-size:11px;font-weight:700;background:#f1f3f2;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.muted{color:#7a857f}
.late{color:#a5381f;font-weight:600}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;min-height:32px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;color:#3c4741;border:1px solid #dfe3e1;background:#fff;font:600 12px Inter,system-ui,sans-serif;text-decoration:none}
.iconbtn:hover{background:#f1f3f2;color:#14231a}
.tab:focus-visible,.iconbtn:focus-visible,.field:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}

.lsw{display:inline-flex;gap:2px;padding:3px;background:#f1f3f2;border-radius:9px}
.lsb{min-width:34px;height:28px;padding:0 8px;display:inline-grid;place-items:center;border-radius:7px;font:600 12.5px Inter,system-ui,sans-serif;color:#4a5850;text-decoration:none}
.lsb:hover{color:#14231a;background:#e4e8e6}
.lsb.on{background:#fff;color:#14231a;box-shadow:0 1px 2px rgba(20,35,26,.14)}
.lsb:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.maintabs{display:inline-flex;gap:2px;padding:3px;background:#e9edeb;border-radius:10px;align-self:flex-start;flex:none}
.mtab{all:unset;box-sizing:border-box;cursor:pointer;min-height:34px;padding:0 16px;border-radius:8px;font:600 13px Inter,system-ui,sans-serif;color:#4a5850;display:inline-flex;align-items:center;gap:8px}
.mtab small{font-size:11px;font-weight:600;color:#7a857f;background:#dfe4e1;border-radius:999px;padding:0 7px}
.mtab:hover{color:#14231a}
.mtab.on{background:#fff;color:#14231a;box-shadow:0 1px 2px rgba(20,35,26,.14)}
.mtab.on small{background:#e8f3ec;color:#1b6b41}
.mtab:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;min-height:30px;padding:0 12px;border:1px solid #dfe3e1;border-radius:999px;background:#fff;font:500 12px Inter,system-ui,sans-serif;color:#3c4741;display:inline-flex;align-items:center;gap:6px}
.chip i{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip small{font-size:11px;color:#7a857f;font-weight:600}
.chip.on{background:#14231a;border-color:#14231a;color:#fff}
.chip.on small{color:#c9d3cd}
.chip:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.wrap{background:#fff;border:1px solid #e7eae8;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.tscroll{flex:1 1 auto;min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;z-index:1;text-align:left;font-size:11.5px;font-weight:600;color:#66716b;padding:10px 14px;background:#fafbfa;border-bottom:1px solid #e7eae8;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #f0f2f1;white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:#fafbfa}
.dlink{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:700;color:#14231a;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.dlink .dico{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#e8f3ec;color:#1b6b41;transition:background .12s,color .12s}
.dlink:hover{color:#1b6b41}
.dlink:hover .dico{background:#1f7a4a;color:#fff}
.dlink:focus-visible{outline:2px solid #1f7a4a;outline-offset:3px;border-radius:3px}
.vcue{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:#7a857f;margin-left:10px;transition:transform .12s}
tr.crow:hover .vcue{color:#1b6b41;transform:translateX(2px)}
.mback{position:fixed;inset:0;background:rgba(20,35,26,.38);display:grid;place-items:center;z-index:50;padding:24px}
.mbox{background:#fff;border-radius:14px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,35,26,.22);overflow:hidden}
.mhead{padding:18px 20px 14px;border-bottom:1px solid #e7eae8;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mbody{overflow:auto;flex:1 1 auto;min-height:0}
.mbody th{top:0}
.mbody td{white-space:normal}
.cmp{display:grid;grid-template-columns:auto auto;column-gap:10px;row-gap:2px;font-size:12px;align-items:baseline}
.cmp small{color:#7a857f;font-size:11px}
.cmp b{font-variant-numeric:tabular-nums;font-weight:600;color:#24302a}
.pct{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.mfoot{padding:12px 20px;border-top:1px solid #e7eae8;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fafbfa}
.mx{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#4a5850;flex:none}
.mx:hover{background:#f1f3f2}
.mx:focus-visible{outline:2px solid #1f7a4a}
.num{text-align:right;font-variant-numeric:tabular-nums}
button.chatbtn{cursor:pointer}
.chatbtn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:1px solid #dfe3e1;border-radius:8px;background:#fff;color:#1b6b41;font:600 12px Inter,system-ui,sans-serif;text-decoration:none;white-space:nowrap}
.chatbtn:hover{background:#e8f3ec;border-color:#9fd0b3;color:#1b6b41}
.mhead .chatbtn{background:#1f7a4a;border-color:#1f7a4a;color:#fff;min-height:36px;padding:0 14px;font-size:13px}
.mhead .chatbtn:hover{background:#18643c;border-color:#18643c;color:#fff}
.chatbtn:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid #e7eae8;font-size:12.5px;color:#66716b}
.pg{all:unset;box-sizing:border-box;cursor:pointer;min-width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;font:500 12.5px Inter,system-ui,sans-serif;color:#3c4741}
.pg:hover{background:#f1f3f2}
.pg.on{background:#e8f3ec;color:#1b6b41;font-weight:700}
.pg[disabled]{opacity:.35;cursor:default}
.pg:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.kpis{display:flex;gap:28px;flex-wrap:wrap;flex:none}
.kpi b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:#7a857f}
@media (max-width:700px){.mn{height:auto}.tscroll{overflow-x:auto;overflow-y:visible}}
.fwrap{position:relative}
.dwrap{position:relative}
.dbtn{all:unset;box-sizing:border-box;cursor:pointer;min-height:36px;padding:0 10px 0 12px;border:1px solid #dfe3e1;border-radius:8px;background:#fff;font:600 13px Inter,system-ui,sans-serif;color:#24302a;display:inline-flex;align-items:center;gap:8px}
.dbtn:hover{border-color:#c9d2cd}
.dbtn.active{border-color:#1f7a4a;color:#1b6b41;background:#f4faf6}
.dbtn:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.dpop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;grid-template-columns:240px;background:#fff;border:1px solid #e1e5e3;border-radius:12px;box-shadow:0 16px 40px rgba(20,35,26,.16);overflow:hidden}
.dpre{background:#f6f8f7;border-right:1px solid #eef0ef;padding:12px 8px;display:flex;flex-direction:column;gap:1px;max-height:470px;overflow:auto}
.dhead{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a857f;padding:10px 8px 4px}
.dsub{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#a3aca7;padding:8px 8px 2px}
.dpo{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 8px;border-radius:6px;font:500 13px Inter,system-ui,sans-serif;color:#24302a}
.dpo:hover{background:#e9eeeb}
.dpo.on{background:#e8f3ec;color:#1b6b41;font-weight:600}
.dinput{box-sizing:border-box;width:100%;min-height:36px;padding:0 10px;border:1px solid #dfe3e1;border-radius:8px;background:#fff;font:500 13px Inter,system-ui,sans-serif;color:#14231a}
.dinput:focus{outline:2px solid #1f7a4a;outline-offset:1px;border-color:#1f7a4a}
.dsel{font-size:12.5px;color:#4a5850;text-align:center;margin-top:8px}
.dcal{padding:12px 14px 12px;display:flex;flex-direction:column;gap:4px}
.dcal .dhead{padding-left:0}
.dlab{font-size:11.5px;color:#7a857f;font-weight:500;margin-top:4px}
.dfield{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;border:1px solid #dfe3e1;border-radius:8px;font-size:13px;color:#14231a;font-variant-numeric:tabular-nums}
.dfield svg{color:#3d6fb4}
.dfield.ph{color:#a3aca7}
.dfield.act{border-color:#1f7a4a;box-shadow:0 0 0 3px rgba(31,122,74,.12)}
.dmonth{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.dmonth b{font-size:14px}
.dnav{all:unset;cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:20px;color:#1b6b41}
.dnav:hover{background:#eef3f0}
.dnav[disabled]{color:#cfd5d2;cursor:default;background:none}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.dwk{font-size:11px;color:#a3aca7;text-align:center;padding:4px 0}
.dday{all:unset;box-sizing:border-box;cursor:pointer;height:32px;display:grid;place-items:center;font:500 13px Inter,system-ui,sans-serif;color:#24302a;font-variant-numeric:tabular-nums}
.dday:hover{background:#dcebe1;border-radius:6px}
.dday.out{color:#b4bcb7}
.dday.inr{background:#e3f1e8}
.dday.edge{background:#1f7a4a;color:#fff;font-weight:700;border-radius:6px}
.dday.today{box-shadow:inset 0 0 0 1.5px #1f7a4a;border-radius:6px}
.dday[disabled]{color:#d3d8d5;cursor:default;background:none}
.dfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #eef0ef}
.fdone[disabled]{opacity:.45;cursor:default}
.fbtn{all:unset;box-sizing:border-box;cursor:pointer;min-height:36px;padding:0 12px;border:1px solid #dfe3e1;border-radius:8px;background:#fff;font:600 13px Inter,system-ui,sans-serif;color:#24302a;display:inline-flex;align-items:center;gap:8px}
.fbtn:hover,.fbtn.open{border-color:#b9c3be;background:#fafbfa}
.fbtn.active{border-color:#1f7a4a}
.fact{font-size:12px;font-weight:600;color:#1b6b41;background:#e8f3ec;border-radius:999px;padding:1px 8px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:320px;max-width:calc(100vw - 32px);background:#fff;border:1px solid #e1e5e3;border-radius:12px;box-shadow:0 12px 32px rgba(20,35,26,.14);padding:10px;display:flex;flex-direction:column;gap:2px}
.fsec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7a857f;padding:10px 8px 4px}
.fopt{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:34px;padding:0 8px;border-radius:7px;display:flex;align-items:center;gap:8px;font:500 13px Inter,system-ui,sans-serif;color:#24302a}
.fopt:hover{background:#f4f6f5}
.fopt small{font-size:11.5px;color:#7a857f;font-weight:600}
.fopt .ck{visibility:hidden;color:#1f7a4a}
.fopt.on{background:#eef7f1;color:#14231a;font-weight:600}
.fopt.on .ck{visibility:visible}
.fdotw{width:8px;display:inline-flex;justify-content:center}
.fdotw i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ffoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef0ef;margin-top:6px;padding:8px 4px 0}
.flink{all:unset;cursor:pointer;font:600 12px Inter,system-ui,sans-serif;color:#66716b;padding:4px}
.flink:hover{color:#14231a}
.fdone{all:unset;cursor:pointer;font:600 12px Inter,system-ui,sans-serif;color:#fff;background:#1f7a4a;border-radius:7px;padding:0 12px;min-height:30px;display:inline-flex;align-items:center}
.fbtn:focus-visible,.fopt:focus-visible,.flink:focus-visible,.fdone:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:none}
.stat{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid #e7eae8;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.stat:hover{border-color:#cfd6d2}
.stat.on{border-color:#14231a;box-shadow:inset 0 0 0 1px #14231a}
.stat.static{cursor:default}
.stat.lowv .sval{margin-top:12px}
.stat.static:hover{border-color:#e7eae8}
.slabel{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:#66716b}
.slabel i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sval{font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.ssub{font-size:11.5px;color:#8a948f}
.stat:focus-visible{outline:2px solid #1f7a4a;outline-offset:2px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cbx{width:16px;height:16px;flex:none;border:1.5px solid #c3cac6;border-radius:4px;background:#fff;display:grid;place-items:center;color:#fff}
.cbx svg{visibility:hidden}
.cbx.on{background:#1f7a4a;border-color:#1f7a4a}
.cbx.on svg{visibility:visible}
.stat{position:relative}
.stat:not(.static):hover{border-color:#9fd0b3;box-shadow:0 2px 10px rgba(20,35,26,.06)}
.stat.on{background:#f4faf6;border-color:#1f7a4a;box-shadow:inset 0 0 0 1px #1f7a4a}
.sact{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#66716b;border:1px solid #e1e5e3;border-radius:999px;padding:2px 8px;background:#fff;white-space:nowrap}
.stat:not(.static):hover .sact{color:#1b6b41;border-color:#9fd0b3;background:#e8f3ec}
.stat.on .sact,.stat.on:hover .sact{background:#1f7a4a;border-color:#1f7a4a;color:#fff}
.shint-unused{font-size:12px;color:#7a857f;margin-top:-6px;display:flex;align-items:center;gap:6px;flex:none}
.sico{margin-left:auto;color:#9aa69e}
.stat:not(.static):hover .sico{color:#1f7a4a}
.stat.on .sico{color:#1f7a4a}
.sbar{display:block;height:5px;border-radius:999px;background:#e7eae8;overflow:hidden;margin:2px 0 1px}
.sbar span{display:block;height:5px;background:#1f7a4a;border-radius:999px}
.datef{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 12px;border:1px solid #dfe3e1;border-radius:8px;background:#fff;font:600 13px Inter,system-ui,sans-serif;color:#24302a}
.datef.active{border-color:#1f7a4a}
.datef select{all:unset;cursor:pointer;font:600 12px Inter,system-ui,sans-serif;color:#1b6b41;background:#e8f3ec;border-radius:999px;padding:2px 10px;margin-right:4px}
.datef:focus-within{outline:2px solid #1f7a4a;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">

<div class="mn">
  <header style="background: #ffffff; border-bottom: 1px solid #e7eae8; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none">
    <span style="font-weight: 700; font-size: 16px">Pixie</span>
    <nav class="lsw" aria-label="Switch layout"><a class="lsb on" href="option-1.html" title="Option 1: Deals and revenue tabs" aria-label="Option 1: Deals and revenue tabs" aria-current="page">1</a><a class="lsb" href="option-2.html" title="Option 2: Split view" aria-label="Option 2: Split view">2</a></nav>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 11px; color: #7a857f">Sample operators, wells and values</span>
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #e8f3ec; display: grid; place-items: center; font-weight: 600; font-size: 11px" aria-label="Signed in user">SS</div>
    </div>
  </header>

  <main style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; flex: none">
      <div>
        <h1 style="font-size: 22px; font-weight: 700; margin: 0">Royalty Signals</h1>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; flex: none">
      <div class="maintabs" role="tablist" aria-label="Section">
        <button class="{{tabDeals}}" role="tab" aria-selected="{{isDeals}}" onClick="{{goDeals}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path><path d="M10 13h6M10 17h4"></path></svg>DO Approval <small>{{dealsCount}}</small></button>
        <button class="{{tabRev}}" role="tab" aria-selected="{{isRev}}" onClick="{{goRev}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"></path><path d="M7 15l4-4 3 3 5-6"></path></svg>Revenue <small>{{revCount}}</small></button>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
      <div class="fwrap">
        <button class="{{fbtnCls}}" onClick="{{toggleMenu}}" aria-haspopup="true" aria-expanded="{{menuOpen}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg>{{secTitle}}<sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}"><span class="fact">{{activeLabel}}</span></sc-if><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="transform: {{menuRot}}"><path d="M6 9l6 6 6-6"></path></svg></button>

<script>
/* Minimal standalone renderer for the Pixie portfolio prototypes.
   Supports {{path}} bindings, <sc-for list as>, <sc-if value>, on* event bindings
   and a DCLogic base class with setState. No dependencies. */
(function () {
  const BOOL_ATTRS = { disabled: 1, checked: 1, selected: 1, hidden: 1 };
  const EVENTS = { onclick: 'click', onchange: 'change', oninput: 'input', onkeydown: 'keydown' };
  const RX = /\{\{\s*([^}]+?)\s*\}\}/g;

  function lookup(scopes, path) {
    const parts = path.split('.');
    for (let i = scopes.length - 1; i >= 0; i--) {
      const s = scopes[i];
      if (s != null && typeof s === 'object' && parts[0] in s) {
        let v = s[parts[0]];
        for (let j = 1; j < parts.length; j++) v = v == null ? undefined : v[parts[j]];
        return v;
      }
    }
    if (parts[0] === 'true') return true;
    if (parts[0] === 'false') return false;
    return undefined;
  }
  function interp(str, scopes) {
    const m = str.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/);
    if (m) return lookup(scopes, m[1]);
    return str.replace(RX, (_, p) => { const v = lookup(scopes, p); return v == null || v === false ? '' : String(v); });
  }

  function build(node, scopes, out) {
    if (node.nodeType === 3) {
      const t = node.nodeValue;
      out.push(document.createTextNode(t.indexOf('{{') >= 0 ? (() => { const v = interp(t, scopes); return v == null || v === false ? '' : String(v); })() : t));
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-sc')) {
      const kind = node.getAttribute('data-sc');
      if (kind === 'for') {
        const list = interp(node.getAttribute('list') || '', scopes) || [];
        const as = node.getAttribute('as') || 'item';
        (Array.isArray(list) ? list : []).forEach((item) => {
          const sc = scopes.concat([{ [as]: item }]);
          node.content.childNodes.forEach((c) => build(c, sc, out));
        });
      } else if (kind === 'if') {
        if (interp(node.getAttribute('value') || '', scopes)) node.content.childNodes.forEach((c) => build(c, scopes, out));
      }
      return;
    }
    const el = node.cloneNode(false);
    let valueProp;
    Array.from(node.attributes).forEach((a) => {
      const name = a.name;
      if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
      if (EVENTS[name]) {
        el.removeAttribute(name);
        const fn = interp(a.value, scopes);
        if (typeof fn === 'function') el.addEventListener(EVENTS[name], fn);
        return;
      }
      if (a.value.indexOf('{{') < 0) return;
      const v = interp(a.value, scopes);
      if (name === 'value') { valueProp = v == null ? '' : String(v); el.setAttribute('value', valueProp); return; }
      if (BOOL_ATTRS[name]) { if (v && v !== 'false') el.setAttribute(name, ''); else el.removeAttribute(name); return; }
      el.setAttribute(name, v == null ? '' : String(v));
    });
    const kids = [];
    const src = node.tagName === 'TEMPLATE' ? node.content.childNodes : node.childNodes;
    src.forEach((c) => build(c, scopes, kids));
    kids.forEach((k) => el.appendChild(k));
    if (valueProp !== undefined && 'value' in el) el.value = valueProp;
    out.push(el);
  }

  class DCLogic {
    constructor() { this.state = {}; this._queued = false; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      if (!this._queued) { this._queued = true; Promise.resolve().then(() => { this._queued = false; this._render && this._render(); }); }
    }
  }
  window.DCLogic = DCLogic;

  window.mountPrototype = function (Component, templateEl, root) {
    const tpl = document.createElement('template');
    tpl.innerHTML = (templateEl.tagName === "SCRIPT" ? templateEl.textContent : templateEl.innerHTML)
      .replace(/<sc-for\b/g, '<template data-sc="for"').replace(/<\/sc-for>/g, '</template>')
      .replace(/<sc-if\b/g, '<template data-sc="if"').replace(/<\/sc-if>/g, '</template>');
    const comp = new Component();
    comp._render = function () {
      const a = document.activeElement; const id = a && a.id; let s0, s1;
      try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) {}
      const vals = comp.renderVals();
      const out = [];
      tpl.content.childNodes.forEach((c) => build(c, [vals], out));
      root.replaceChildren(...out);
      if (id) { const n = document.getElementById(id); if (n) { n.focus(); try { if (s0 != null) n.setSelectionRange(s0, s1); } catch (e) {} } }
    };
    comp._render();
    return comp;
  };
})();

</script>

    const wellsOf = (k) => doItems.filter((x) => fk(x) === k).reduce((t, x) => t + x.wells, 0);
    const lateOf = (k) => doItems.filter((x) => fk(x) === k && isOverdue(x)).length;
    const oldestOf = (k) => { const a = doItems.filter((x) => fk(x) === k).map((x) => x.since); return a.length ? Math.max.apply(null, a) : 0; };
    const stats = isDeals
      ? Object.keys(DO_FLAGS).map((k) => {

              on: false, cls: 'stat static', pick: null },
            { key: 'total', label: 'Pending DOs', color: '#3d6fb4', value: (DOS.length - done.length) + ' / ' + DOS.length, valColor: '#14231a',

              on: pendOn, cls: pendOn ? 'stat on' : 'stat',

        })())
      : [
          { label: 'Owner share', color: '#7a857f', value: rk.expected, valColor: '#14231a', sub: '', on: false, cls: 'stat static lowv', pick: null },
          { label: 'Difference', color: '#b9412b', value: rk.risk === '$0' ? '$0' : '−' + rk.risk, valColor: '#a5381f', sub: '', on: false, cls: 'stat static lowv', pick: null }
        ].concat(Object.keys(RFLAGS).filter((k) => k !== 'completed').map((k) => {
          const its = DOS.filter(RFLAGS[k].test);
          const late = k === 'completed' ? 0 : its.filter(isOverdue).length;
          return { label: RFLAGS[k].label, color: RFLAGS[k].color, value: its.length, valColor: '#14231a',
            sub: its.length ? its.reduce((t, x) => t + rf(x, k), 0) + ' flagged wells' : 'None',
            on: rS.on(k), cls: rS.on(k) ? 'stat on' : 'stat', pick: rS.toggle(k) };
        }));
    const cards = isDeals ? CARD_ORDER.map((k) => stats.find((t) => t.key === k)) : stats;
    // Popup: operator-level brief for the clicked deal
    const md = st.modal || null;
    const GREY = { color: '#7a857f', border: '#dfe3e1' };
    let m = { isDoT: false, isRevT: false, aHead: '', bHead: '', title: '', kicker: '', sub: '', flags: [], ops: [], foot: '', stop };
    if (md) {
      const all = DOS.filter((x) => x.deal === md.name);
      const wellsT = all.reduce((t, x) => t + x.wells, 0);
      if (md.tab === 'deals') {
        const row = dealAll.find((r) => r.name === md.name);
        const shown = all.filter((x) => x.doS !== 'awaiting' && (x.doS !== 'signed' || dS.on('signed')));
        const ops = shown.map((x) => {
          const k = keyOf(x); const f = DEAL_DEFS[k];
          const days = daysOf(x); const late = x.doS !== 'signed' && isOverdue(x);
          const showCmp = x.doS === 'mismatch';
          return { ...(showCmp ? cmpOf(x, 'Deed', 'DO') : { hasCmp: false, noCmp: true, aVal: '—', bVal: '—' }), op: x.op, wells: x.wells, status: f ? f.flag : 'Awaiting DO', color: f ? f.color : GREY.color, border: f ? f.border : GREY.border,
            rank: f ? f.rank : 9, days,
            note: x.doS === 'signed' ? 'DO approved, acceptance sent' : (x.note || '—'),
            date: dateOf(days), ago: (x.doS === 'signed' ? 'approved ' : '') + agoOf(days), ageCls: 'muted' };
        }).sort((a, b) => a.rank - b.rank || a.days - b.days);
        m = { ...m, isDeals: false, isRev: true, isDoT: true, isRevT: false, aHead: 'Deed', bHead: 'DO', kicker: 'Division orders', title: md.name, flags: row ? row.flags : [], ops,
          sub: plural(shown.length, 'operator', 'operators') + ' · ' + shown.reduce((t, x) => t + x.wells, 0) + ' wells',
          foot: 'One row per operator DO package' };
      } else {
        const row = revAll.find((r) => r.name === md.name);
        const signed = all.filter((x) => x.doS === 'signed');
        const ops = signed.map((x) => {
          const fl = ['decimal', 'volume'].filter((k) => rf(x, k) > 0).map((k) => ({ label: RFLAGS[k].label, color: RFLAGS[k].color, border: RFLAGS[k].border, n: rf(x, k), hasN: true, noN: false }));
          const flagged = fl.reduce((t, f) => t + f.n, 0);
          const done = x.rev === 'ok';
          const flags = fl;
          return { op: x.op, flags, flagged, flaggedLabel: flagged ? String(flagged) : '—',
            rank: fl.length ? 0 : (done ? 2 : 1), days: x.since };
        }).filter((o) => o.flags.length).sort((a, b) => a.rank - b.rank || a.days - b.days);
        m = { ...m, isDeals: false, isRev: true, isDoT: false, isRevT: true, aHead: 'Expected', bHead: 'Pay stub', kicker: 'Revenue', title: md.name, flags: row ? row.flags : [], ops,
          sub: plural(signed.length, 'operator', 'operators') + ' · ' + signed.reduce((t, x) => t + x.wells, 0) + ' wells',
          foot: 'Only operators with an approved DO are checked for revenue' };
      }
    }
    const menuOpen = !!st.menuOpen;
    const opNames = Array.from(new Set(doItems.map((x) => x.op))).sort();
    const opList = ['All operators'].concat(opNames).map((o) => ({
      label: o, on: o === opF, cls: o === opF ? 'fopt on' : 'fopt',
      count: o === 'All operators' ? doItems.length : doItems.filter((x) => x.op === o).length,
      pick: () => this.setState({ opF: o, page: 1 })
    }));
    const activeParts = [];
    const curSel = isDeals ? dS.sel.map((k) => DEAL_DEFS[k].flag) : rS.sel.map((k) => RFLAGS[k].label);
    if (curSel.length) activeParts.push(curSel.length === 1 ? curSel[0] : curSel[0] + ' +' + (curSel.length - 1));
    return {
      hasModal: !!md, m, closeModal: () => this.setState({ modal: null }),
      menuOpen, menuRot: menuOpen ? 'rotate(180deg)' : 'none', opList,
      fbtnCls: 'fbtn' + (menuOpen ? ' open' : '') + (activeParts.length ? ' active' : ''),
      hasActive: true, activeLabel: activeParts.length ? activeParts.join(' · ') : 'All',
      secTitle: 'Flags',
      toggleMenu: () => this.setState({ menuOpen: !menuOpen, calOpen: false }),
      clearAll: () => this.setState(isDeals ? { dealSel: {}, dateRange: 'any', page: 1 } : { revSel: {}, dateRange: 'any', page: 1 }),
      isDeals, isRev: !isDeals,
      tabDeals: isDeals ? 'mtab on' : 'mtab', tabRev: isDeals ? 'mtab' : 'mtab on',
      goDeals: () => this.setState({ tab: 'deals', page: 1, menuOpen: false }), goRev: () => this.setState({ tab: 'revenue', page: 1, menuOpen: false }),
      dealsCount: pendingDeals, revCount: revAll.length,
      dateRange, ...(() => {
        const calOpen = !!st.calOpen;
        const pFrom = st.pFrom == null ? null : st.pFrom, pTo = st.pTo == null ? null : st.pTo;
        const calY = st.calY == null ? Y : st.calY, calM = st.calM == null ? M : st.calM;
        const first = new Date(calY, calM, 1); const off = (first.getDay() + 6) % 7;
        const dim = new Date(calY, calM + 1, 0).getDate(); const cells = Math.ceil((off + dim) / 7) * 7;
        const calDays = Array.from({ length: cells }, (_, i) => {
          const ts = ymd(calY, calM, 1 - off + i); const d = new Date(ts);
          const edge = ts === pFrom || ts === pTo; const inr = pFrom != null && pTo != null && ts > pFrom && ts < pTo;
          return { n: d.getDate(), future: ts > T0, aria: fmtD(ts),
            cls: 'dday' + (d.getMonth() !== calM ? ' out' : '') + (inr ? ' inr' : '') + (edge ? ' edge' : '') + (ts === T0 && !edge ? ' today' : ''),
            pick: () => { if (pFrom == null || pTo != null) this.setState({ pFrom: ts, pTo: null }); else if (ts < pFrom) this.setState({ pFrom: ts, pTo: pFrom }); else this.setState({ pTo: ts }); } };
        });
        const openAt = (rTo || T0);
        return {
          calOpen, calRot: calOpen ? 'rotate(180deg)' : 'none',
          dateBtnCls: dateRange !== 'any' ? 'dbtn active' : 'dbtn',
          dateLabel: dateRange === 'any' ? 'All dates' : (rFrom === rTo ? shortD(rFrom) + ' ' + new Date(rFrom).getFullYear() : shortD(rFrom) + ' – ' + shortD(rTo) + ' ' + new Date(rTo).getFullYear()),
          toggleCal: () => this.setState(calOpen ? { calOpen: false } : { calOpen: true, menuOpen: false, pFrom: rFrom, pTo: rTo, calY: new Date(openAt).getFullYear(), calM: new Date(openAt).getMonth() }),
          allCls: dateRange === 'any' ? 'dpo on' : 'dpo',
          pickAll: () => this.setState({ dateRange: 'any', calOpen: false, page: 1 }),
          presetGroups: PGROUPS.map(([label, keys]) => ({ label, items: keys.map((k) => ({ label: PRESETS[k][0], cls: dateRange === k ? 'dpo on' : 'dpo', pick: () => this.setState({ dateRange: k, calOpen: false, page: 1 }) })) })),
          fromLabel: pFrom == null ? 'Start date' : fmtD(pFrom), toLabel: pTo == null ? (pFrom == null ? 'End date' : fmtD(pFrom)) : fmtD(pTo),
          fromCls: 'dfield' + (pFrom == null ? ' ph' : '') + (pFrom == null || pTo != null ? ' act' : ''),
          toCls: 'dfield' + (pTo == null ? ' ph' : '') + (pFrom != null && pTo == null ? ' act' : ''),
          calTitle: ['January','February','March','April','May','June','July','August','September','October','November','December'][calM] + ' ' + calY,
          prevMonth: () => this.setState(calM === 0 ? { calM: 11, calY: calY - 1 } : { calM: calM - 1 }),
          nextMonth: () => this.setState(calM === 11 ? { calM: 0, calY: calY + 1 } : { calM: calM + 1 }),
          nextOff: calY > Y || (calY === Y && calM >= M),
          weekDays: ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'], calDays,
          fromVal: pFrom == null ? '' : isoD(pFrom), toVal: pTo == null ? '' : isoD(pTo), todayVal: isoD(T0), toMax: pTo == null ? isoD(T0) : isoD(pTo),
          onFrom: (e) => { const v = e.target.value; this.setState({ pFrom: v ? parseD(v) : null }); },
          onTo: (e) => { const v = e.target.value; this.setState({ pTo: v ? parseD(v) : null }); },
          clearCal: () => this.setState({ pFrom: null, pTo: null, dateRange: 'any', calOpen: false, page: 1 }),
          rangeText: pFrom == null ? 'Pick a start date' : (pTo == null ? shortD(pFrom) + ' – pick an end date' : shortD(pFrom) + ' – ' + shortD(pTo) + ' ' + new Date(pTo).getFullYear()),
          applyOff: pFrom == null && pTo == null,
          applyCal: () => { const f = pFrom == null ? pTo : pFrom; const t = pTo == null ? (pFrom == null ? null : T0) : pTo; this.setState(f == null ? { calOpen: false } : { dateRange: 'custom', dFrom: Math.min(f, t, T0), dTo: Math.min(Math.max(f, t), T0), calOpen: false, page: 1 }); }
        };
      })(),
      rangeOpts: RANGES.map((r) => ({ v: r.v, label: r.label })),
      dateCls: dateRange !== 'any' ? 'datef active' : 'datef',
      onRange: (e) => this.setState({ dateRange: e.target.value, page: 1 }),
      stats: cards.map((t) => ({ ...t, isFilter: !!t.pick, actLabel: t.on ? 'Filtering' : 'Filter', tip: t.pick ? (t.on ? 'Click to remove this filter' : 'Click to show only ' + t.label + ' in the list') : '' })),
      hint: stats.some((t) => t.on) ? 'Showing selected flags only. Click a highlighted card again to remove its filter.' : 'Click a flag card to filter the list below. Select more than one to combine.', statCols: cards.length,
      subtitle: isDeals
        ? cnt('mismatch') + ' DO mismatches · ' + cnt('with_op') + ' emails sent'
        : rk.risk + ' at risk across ' + revAll.filter((r) => r.risk > 0).length + ' deals · ' + rk.issues + ' deals with revenue issues',
      chips: isDeals ? dealChips : revChips,
      dealRows: isDeals ? slice : [], revRows: isDeals ? [] : slice, empty: !slice.length, rk,
      searchPh: 'Search',
      opOpts: ['All operators'].concat(Array.from(new Set(doItems.map((x) => x.op))).sort()), opF, q: st.q || '',
      onOp: (e) => this.setState({ opF: e.target.value, page: 1 }), onQ: (e) => this.setState({ q: e.target.value, page: 1 }),
      pages: Array.from({ length: pagesN }, (_, i) => ({ n: i + 1, cls: i + 1 === page ? 'pg on' : 'pg', pick: () => this.setState({ page: i + 1 }) })),
      atStart: page === 1, atEnd: page === pagesN,
      prev: () => this.setState({ page: Math.max(1, page - 1) }), next: () => this.setState({ page: Math.min(pagesN, page + 1) }),
      from: list.length ? (page - 1) * PAGE + 1 : 0, to: Math.min(page * PAGE, list.length), total: list.length,
      unit: 'deals'
